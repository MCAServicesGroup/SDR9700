name: Build

on:
  push:
    branches:
      - main
    tags:
      - 'ci-*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Test CI Qt setup
        run: bash _developer/scripts/tests/setup_ci_qt_test.sh
      - name: Configure LLVM 23 package repository
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends ca-certificates gnupg wget
          wget -q https://apt.llvm.org/llvm-snapshot.gpg.key -O "$RUNNER_TEMP/apt.llvm.org.asc"
          test "$(gpg --show-keys --with-colons "$RUNNER_TEMP/apt.llvm.org.asc" \
            | awk -F: '$1 == "fpr" { print $10; exit }')" = "6084F3CF814B57C1CF12EFD515CF4D18AF4F7421"
          sudo install -m 0644 "$RUNNER_TEMP/apt.llvm.org.asc" /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-toolchain-23.list
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential cmake ninja-build pkg-config python3-venv curl \
            clang-format-23 \
            libssl-dev libopus-dev libgl1-mesa-dev libpulse0 \
            libspeexdsp-dev libxkbcommon-dev libxkbcommon-x11-0 libeigen3-dev libhidapi-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-randr0 \
            libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0
          bash _developer/scripts/setup_ci_qt.sh
          clang-format-23 --version | grep -E 'clang-format version 23\.'
          cmake --version
      - name: Build cppcheck 2.21.0
        run: |
          wget -q https://github.com/cppcheck-opensource/cppcheck/archive/refs/tags/2.21.0.tar.gz \
            -O "$RUNNER_TEMP/cppcheck-2.21.0.tar.gz"
          echo "f028ff75ca5372738f3737c8b3e8611426a6526b6aea2ef01301ab0f5902f044  $RUNNER_TEMP/cppcheck-2.21.0.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/cppcheck-2.21.0.tar.gz" -C "$RUNNER_TEMP"
          cmake -S "$RUNNER_TEMP/cppcheck-2.21.0" -B "$RUNNER_TEMP/cppcheck-build" \
            -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build "$RUNNER_TEMP/cppcheck-build" -j2
          echo "$RUNNER_TEMP/cppcheck-build/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/cppcheck-build/bin/cppcheck" --version | grep -F "Cppcheck 2.21.0"
      - name: Build
        run: make release
      - name: Source checks
        run: make check
      - name: Test
        run: ctest --test-dir _workspace/build --output-on-failure

  macos:
    name: Apple Silicon macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify runner architecture
        run: test "$(uname -m)" = "arm64"
      - name: Install dependencies
        run: |
          brew install cmake ninja pkg-config python openssl@3 opus speexdsp eigen hidapi
          bash _developer/scripts/setup_ci_qt.sh
      - name: Build
        run: make release
      - name: Verify Metal panadapter build
        run: |
          grep -Fq 'SDR9700_ENABLE_GPU_PANADAPTER:BOOL=ON' _workspace/build/CMakeCache.txt
          nm _workspace/build/bin/SDR9700.app/Contents/MacOS/SDR9700 \
            | grep -F 'qInitResources_SDR9700_panadapter_shaders' >/dev/null
      - name: Test Metal panadapter rendering
        run: ctest --test-dir _workspace/build --output-on-failure --no-tests=error -L gpu
      - name: Test
        run: ctest --test-dir _workspace/build --output-on-failure
      - name: Verify self-contained application bundle
        run: |
          make bundle
          make verify-bundle

  linux-no-hidapi:
    name: Linux without HIDAPI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential cmake ninja-build pkg-config python3-venv curl \
            libssl-dev libopus-dev libgl1-mesa-dev libpulse0 \
            libspeexdsp-dev libxkbcommon-dev libxkbcommon-x11-0 libeigen3-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-randr0 \
            libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0
          bash _developer/scripts/setup_ci_qt.sh
      - name: Build without HIDAPI
        run: |
          cmake -S . -B _workspace/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDR9700_ENABLE_HIDAPI=OFF
          cmake --build _workspace/build -j2
          grep -Fq 'SDR9700_ENABLE_HIDAPI:BOOL=OFF' _workspace/build/CMakeCache.txt
      - name: Test
        run: ctest --test-dir _workspace/build --output-on-failure

  linux-gpu-panadapter:
    name: Linux GPU panadapter
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential cmake ninja-build pkg-config python3-venv curl xauth xvfb \
            libssl-dev libopus-dev libspeexdsp-dev libeigen3-dev libgl1-mesa-dev libpulse0 libvulkan-dev \
            mesa-vulkan-drivers \
            libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-randr0 \
            libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0
      - name: Install Qt
        run: |
          bash _developer/scripts/setup_ci_qt.sh
      - name: Build GPU panadapter
        run: |
          cmake -S . -B _workspace/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDR9700_ENABLE_GPU_PANADAPTER=ON
          cmake --build _workspace/build -j2
          grep -Fq 'SDR9700_ENABLE_GPU_PANADAPTER:BOOL=ON' _workspace/build/CMakeCache.txt
      - name: Test with software Vulkan
        run: xvfb-run -a env SDR9700_TEST_RHI_BACKEND=vulkan ctest --test-dir _workspace/build --output-on-failure
