name: Release macOS DMG

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing signed tag and draft GitHub Release at the selected main commit
        required: true
        type: string

permissions:
  contents: write

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

concurrency:
  group: release-macos-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  package:
    name: Apple Silicon macOS
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'MCAServicesGroup/sdr9700'
    runs-on: macos-15
    environment: macos_release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-tags: false

      - name: Verify signed tag, draft release, and source version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "$(uname -m)" = "arm64"
          [[ "$RELEASE_TAG" =~ ^v[0-9]{2}\.[0-9]{1,2}\.[0-9]+(-[a-z]+\.[0-9]+)?$ ]]
          git fetch --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          tag_object="$(git rev-parse "refs/tags/$RELEASE_TAG^{tag}")"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq '.verification.verified')" = true
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = true
          version="$(sed -n 's/^set(SDR9700_DISPLAY_VERSION "\([^"]*\)").*/\1/p' CMakeLists.txt)"
          test -n "$version"
          test "$RELEASE_TAG" = "v${version}"

      - name: Install build dependencies
        run: |
          brew install cmake ninja pkg-config openssl@3 opus speexdsp eigen hidapi
          bash _developer/scripts/setup_ci_qt.sh

      - name: Build and test
        run: |
          make release
          grep -Fq 'SDR9700_ENABLE_GPU_PANADAPTER:BOOL=ON' _workspace/build/CMakeCache.txt
          nm _workspace/build/bin/SDR9700.app/Contents/MacOS/SDR9700 \
            | grep -F 'qInitResources_SDR9700_panadapter_shaders' >/dev/null
          ctest --test-dir _workspace/build --output-on-failure

      - name: Import Developer ID certificate
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          keychain_path="$RUNNER_TEMP/sdr9700-build.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"

          echo "$APPLE_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" \
            -k "$keychain_path" \
            -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"

      - name: Bundle, audit, sign, and create DMG
        env:
          SDR9700_SIGN_IDENTITY: Developer ID Application
        run: |
          make release-dmg
          make verify-bundle
          codesign --verify --deep --strict --verbose=2 _workspace/build/bin/SDR9700.app

          dmg_path="$(find _workspace/build/package -maxdepth 1 -name 'SDR9700-*-macOS-apple-silicon.dmg' -print -quit)"
          test -n "$dmg_path"
          echo "SDR9700_DMG=$dmg_path" >> "$GITHUB_ENV"

      - name: Store notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials "sdr9700-ci" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"

      - name: Notarize and staple DMG
        env:
          SDR9700_NOTARY_PROFILE: sdr9700-ci
        run: |
          make notarize DMG="$SDR9700_DMG"
          xcrun stapler validate "$SDR9700_DMG"
          spctl --assess --type open \
            --context context:primary-signature \
            --verbose=4 \
            "$SDR9700_DMG"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: SDR9700-macOS-apple-silicon
          path: ${{ env.SDR9700_DMG }}
          if-no-files-found: error

      - name: Attach DMG to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = true
          gh release upload "$RELEASE_TAG" "$SDR9700_DMG" --clobber
